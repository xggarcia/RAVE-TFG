[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rave-tfg"
version = "0.4.2"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "numpy>=1.24",
]

[project.scripts]
rave-tfg = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "rave_core*", "src*"]
