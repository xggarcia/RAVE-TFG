[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "rave-tfg"
version = "0.4.2"
requires-python = ">=3.10"
dependencies = [
    # Desktop app
    "PySide6>=6.7",
    "pyqtgraph>=0.13",
    # Audio I/O and processing
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyloudnorm>=0.1",
    "numpy>=1.24",
    "requests>=2.28",
    # Deep learning
    "torch>=2.4",
    "torchaudio>=2.4",
    # acids-rave + acids-msprior and their transitive deps
    "acids-rave>=2.3.0",
    "acids-msprior>=0.1.0",
    "scipy>=1.12",
    "pytorch-lightning>=1.9,<2.0",
    "absl-py>=1.2",
    "cached-conv>=2.4.1",
    "einops>=0.5",
    "Flask",
    "gin-config",
    "GPUtil>=1.4",
    "nn-tilde>=1.4",
    "PyYAML>=6.0",
    "scikit-learn",
    "tensorboard",
    "tqdm",
    "udls>=1.0",
    "lmdb",
    "pathos",
]

[project.scripts]
rave-tfg = "app.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]
